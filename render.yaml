services:
  - type: web
    name: utya-miner-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: UTYA_miner_bot
      - key: PUBLIC_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_IDS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: TON_DEPOSIT_ADDRESS
        sync: false
      - key: TONAPI_KEY
        sync: false
