<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#071a21" />
<title>UTYA Miner</title>
<link rel="icon" href="/icon.png" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#071a21; --bg2:#0c2630; --card:#10303b; --card2:#143a47; --line:rgba(120,220,210,.16);
  --text:#e9f7f5; --muted:#9bbdbb; --dim:#6f9795;
  --duck:#ffcd38; --duck2:#ff9d2e; --aqua:#37d6c4; --red:#ff8a7a; --green:#6fe3a0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(86px + env(safe-area-inset-bottom,0px));background:radial-gradient(120% 60% at 50% -10%,#12414d 0%,var(--bg) 60%) fixed}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.top svg{flex:none}
.brand{font-weight:800;font-size:19px;letter-spacing:.2px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.chip{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);line-height:1.25}
.chip b{display:block;color:var(--text);font-size:14px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;box-shadow:0 0 8px var(--green)}
.dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;letter-spacing:.2px}
.warn{background:rgba(255,205,56,.09);border-color:rgba(255,205,56,.35)}
.warn b{color:var(--duck)}
.muted{color:var(--muted);font-size:13px;line-height:1.45}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--muted)}
.big{font-size:26px;font-weight:800;color:var(--duck)}
.field{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line2,rgba(120,220,210,.3));border-radius:14px;padding:4px 6px 4px 14px}
.field input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:24px;font-weight:700;padding:8px 0}
.field span{font-weight:700;color:var(--muted);padding:0 8px}
.chips{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.chips button{flex:1;min-width:56px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 0;font-weight:700}
.chips button.on{background:var(--duck);color:#2b1d00;border-color:var(--duck)}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:800;background:linear-gradient(180deg,var(--duck),var(--duck2));color:#2b1d00;margin-top:10px}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.small{width:auto;padding:9px 14px;font-size:13px;border-radius:12px;margin-top:0}
.btn[disabled]{opacity:.45;cursor:default}
.addr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;word-break:break-all;color:var(--muted)}
.status{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--card2)}
.st-paid{background:rgba(255,205,56,.2);color:var(--duck)}
.st-delivered{background:rgba(111,227,160,.2);color:var(--green)}
.st-refund_requested{background:rgba(255,157,46,.2);color:var(--duck2)}
.st-refunded{background:rgba(55,214,196,.2);color:var(--aqua)}
.st-failed,.st-expired{background:rgba(255,138,122,.16);color:var(--red)}
ol,ul{margin:0;padding-left:20px}
li{margin:7px 0;font-size:14px;line-height:1.45}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(7,26,33,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.nav button{flex:1;background:transparent;border:0;padding:8px 0;border-radius:14px;color:var(--muted);font-size:12px;font-weight:700}
.nav button.on{background:var(--card2);color:var(--duck)}
.nav button span{display:block;font-size:20px;line-height:1.1}
.ov{position:fixed;inset:0;background:rgba(3,12,16,.78);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom,0px));text-align:center}
.sheet h2{margin:8px 0}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--card2);border-top-color:var(--duck);margin:6px auto 12px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.toast{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:99;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:14px;text-align:center}
.toast.err{border-color:rgba(255,138,122,.6)}
.toast.ok{border-color:rgba(111,227,160,.6)}
.langs{display:flex;gap:8px}
.langs button{flex:1;padding:9px 0;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700}
.langs button.on{background:var(--duck);color:#2b1d00;border-color:var(--duck)}
.full{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
a{color:var(--aqua)}
</style>
</head>

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const t = (key, vars) => {
  const raw = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  return raw.replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] !== undefined ? String(vars[k]) : "{" + k + "}"));
};
const nf = (n, max) => Number(n).toLocaleString(lang === "ru" ? "ru-RU" : lang === "bn" ? "bn-BD" : "en-US", { maximumFractionDigits: max === undefined ? 2 : max });
const buzz = (kind) => { try { tgw && tgw.HapticFeedback && (kind === "ok" ? tgw.HapticFeedback.notificationOccurred("success") : tgw.HapticFeedback.impactOccurred("light")); } catch (e) {} };

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "content-type": "application/json", "x-init-data": INIT },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error(data.error || "Error"); err.code = data.code; err.vars = data.vars; err.data = data; throw err; }
  return data;
}
function errText(e) {
  if (e && e.code && I18N.en["err." + e.code]) return t("err." + e.code, e.vars || {});
  return e && e.message && e.code ? e.message : t("err.generic");
}
let toastTimer = null;
function toast(msg, kind) {
  $("#toast").innerHTML = '<div class="toast ' + (kind || "") + '">' + esc(msg) + "</div>";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("#toast").innerHTML = ""; }, 3500);
}
const closeOverlay = () => { $("#ov").innerHTML = ""; };
function openOverlay(html) { $("#ov").innerHTML = '<div class="ov"><div class="sheet">' + html + "</div></div>"; }

const dateText = (ms) => new Date(ms).toLocaleString(lang === "ru" ? "ru-RU" : lang === "bn" ? "bn-BD" : "en-GB", { dateStyle: "medium", timeStyle: "short" });

// ------------------------------------------------------------------ wallet (TonConnect)
function ton() {
  if (tonUI) return tonUI;
  try {
    if (!window.TON_CONNECT_UI) return null;
    tonUI = new window.TON_CONNECT_UI.TonConnectUI({
      manifestUrl: window.location.origin + "/tonconnect-manifest.json",
      actionsConfiguration: { twaReturnUrl: "https://t.me/" + BOT_USERNAME },
    });
    tonUI.onStatusChange((w) => {
      if (w && w.account && S) syncWallet(w.account.address).then(() => render()).catch(() => render());
      else if (S) render();
    });
    return tonUI;
  } catch (e) { return null; }
}
const connectedAccount = () => { const ui = ton(); return ui && ui.account ? ui.account : null; };
async function syncWallet(rawAddress) {
  const r = await api("/api/wallet", { address: rawAddress });
  S = r.state;
}

// ------------------------------------------------------------------ quote
let amtTimer = null;
function onAmount(e) {
  amount = e.target.value.replace(",", ".");
  quote = null; quoteErr = null;
  document.querySelectorAll(".chips button").forEach((b) => b.classList.toggle("on", b.dataset.v === String(amount)));
  refreshQuoteUI();
  clearTimeout(amtTimer);
  amtTimer = setTimeout(refreshQuote, 350);
}
async function refreshQuote() {
  if (!S || tab !== "buy" || quoting) return;
  const wanted = amount;
  quoting = true;
  try {
    const r = await api("/api/quote", { ton: Number(wanted) });
    if (wanted === amount) { quote = r.quote; quoteErr = null; }
  } catch (e) {
    if (e && e.code === "banned") return showBanned(e.data);
    if (wanted === amount) { quote = null; quoteErr = errText(e); }
  } finally { quoting = false; }
  if (wanted !== amount) return refreshQuote();
  refreshQuoteUI();
}
async function refreshState() {
  try {
    const r = await api("/api/state");
    S = r;
    lang = S.user.lang || lang;
    if (tab === "orders" || tab === "info") render(); else { const c = $("#chip"); if (c) c.outerHTML = priceChip(); }
  } catch (e) { /* keep the old state */ }
}

function showPay(stage, extra) {
  if (stage === "confirm") openOverlay('<div class="spin"></div><h2>' + esc(t("pay.confirm")) + "</h2>");
  else if (stage === "wait") openOverlay('<div class="spin"></div><h2>' + esc(t("pay.wait")) + "</h2>");
  else if (stage === "slow") openOverlay("<h2>⏳</h2><p class=\"muted\">" + esc(t("pay.slow")) + '</p><button class="btn" data-a="closeov">' + esc(t("pay.close")) + "</button>");
  else if (stage === "done") openOverlay('<div style="font-size:54px">🦆</div><h2>' + esc(t("pay.done")) + '</h2><p class="muted">' + esc(t("pay.doneBody", { utya: nf(extra.utya, 2), hours: S.settings.deliveryHours })) + '</p><button class="btn" data-a="toOrders">' + esc(t("pay.toOrders")) + "</button>");
}

async function startPay() {
  if (busy) return;
  const ui = ton();
  if (!ui) return toast(t("err.generic"), "err");
  const acc = ui.account;
  if (!acc) return ui.openModal();
  busy = true;
  let prepared;
  try {
    await syncWallet(acc.address);
    prepared = (await api("/api/pay/prepare", { ton: Number(amount) })).payment;
  } catch (e) {
    busy = false;
    if (e && e.code === "join_required") return showGate(e.data.channels);
    if (e && e.code === "banned") return showBanned(e.data);
    return toast(errText(e), "err");
  }
  showPay("confirm");
  try {
    await ui.sendTransaction({ validUntil: prepared.validUntil, from: acc.address, messages: prepared.messages });
  } catch (e) { busy = false; closeOverlay(); return toast(t("pay.cancelled"), "err"); }
  showPay("wait");
  const started = Date.now();
  while (Date.now() - started < 180000) {
    let r = null;
    try { r = await api("/api/pay/check", { id: prepared.id }); } catch (e) { /* keep trying */ }
    if (r && r.order && ["paid", "delivered", "refund_requested", "refunded"].includes(r.order.status)) {
      busy = false; S = r.state; buzz("ok"); showPay("done", r.order); render(); return;
    }
    await new Promise((res) => setTimeout(res, 3000));
  }
  busy = false; showPay("slow");
}

// ------------------------------------------------------------------ special screens
function showBanned(data) {
  const support = data && data.support;
  $("#app").innerHTML = '<div class="full"><div style="font-size:54px">🚫</div><h2>' + esc(t("banned.title")) + "</h2>" + (support ? '<button class="btn" data-a="support" data-url="' + esc(support) + '">' + esc(t("banned.contact")) + "</button>" : "") + "</div>";
}
function showGate(channels) {
  $("#app").innerHTML = '<div class="full"><div style="font-size:54px">📣</div><h2>' + esc(t("gate.title")) + '</h2><p class="muted">' + esc(t("gate.body")) + "</p>" +
    (channels || []).map((c) => '<button class="btn ghost" data-a="link" data-url="' + esc(c.url) + '">' + esc(c.name) + "</button>").join("") + '<button class="btn" data-a="reload">' + esc(t("gate.btn")) + "</button></div>";
}
function openLink(url) { try { if (tgw && /^https:\/\/t\.me\//.test(url) && tgw.openTelegramLink) return tgw.openTelegramLink(url); if (tgw && tgw.openLink) return tgw.openLink(url); } catch (e) {} window.open(url, "_blank"); }

// ------------------------------------------------------------------ clicks
document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a;
  buzz();
  if (a === "tab") { tab = el.dataset.v; render(); if (tab === "buy") { quote = null; refreshQuote(); } return; }
  if (a === "preset") { amount = el.dataset.v; const i = $("#amt"); if (i) i.value = amount; document.querySelectorAll(".chips button").forEach((b) => b.classList.toggle("on", b.dataset.v === amount)); quote = null; quoteErr = null; refreshQuoteUI(); refreshQuote(); return; }
  if (a === "connect") { const ui = ton(); if (ui) ui.openModal(); else toast(t("err.generic"), "err"); return; }
  if (a === "disconnect") { const ui = ton(); if (ui) { try { await ui.disconnect(); } catch (e) {} } render(); return; }
  if (a === "pay") return startPay();
  if (a === "closeov") return closeOverlay();
  if (a === "toOrders") { closeOverlay(); tab = "orders"; render(); return; }
  if (a === "support") return openLink(el.dataset.url || (S && S.settings.support));
  if (a === "link") return openLink(el.dataset.url);
  if (a === "reload") return location.reload();
  if (a === "lang") {
    try { const r = await api("/api/lang", { lang: el.dataset.v }); S = r.state; lang = S.user.lang; render(); } catch (e) { toast(errText(e), "err"); }
    return;
  }
  if (a === "refund") {
    const o = S.orders.find((x) => x.id === el.dataset.id);
    if (!o) return;
    openOverlay("<h2>↩️</h2><p>" + esc(t("orders.refundAsk", { ton: nf(o.ton, 4) })) + '</p><button class="btn" data-a="refundYes" data-id="' + esc(o.id) + '">' + esc(t("orders.refundYes")) + '</button><button class="btn ghost" data-a="closeov">' + esc(t("orders.refundNo")) + "</button>");
    return;
  }
  if (a === "refundYes") {
    closeOverlay();
    try { const r = await api("/api/refund", { id: el.dataset.id }); S = r.state; toast(t("orders.refundDone"), "ok"); render(); } catch (e) { toast(errText(e), "err"); await refreshState(); }
    return;
  }
});

// ------------------------------------------------------------------ start
async function boot() {
  try {
    S = await api("/api/state");
  } catch (e) {
    if (e && e.code === "join_required") return showGate(e.data.channels);
    if (e && e.code === "banned") return showBanned(e.data);
    $("#app").innerHTML = '<div class="full"><div style="font-size:54px">🦆</div><p class="muted">' + esc(errText(e)) + "</p></div>";
    return;
  }
  lang = S.user.lang || "en";
  ton(); // create the wallet connector early so a restored wallet shows up
  render();
  const acc = connectedAccount();
  if (acc) syncWallet(acc.address).then(render).catch(() => {});
  refreshQuote();
  setInterval(() => { if (!document.hidden) { refreshState(); if (tab === "buy" && !busy) refreshQuote(); } }, 15000);
  setInterval(() => { const c = $("#chip"); if (c && S) c.outerHTML = priceChip(); }, 1000);
}
boot();
</script>
</body>
</html>
