<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#071a21" />
<title>UTYA Miner</title>
<link rel="icon" href="/icon.png" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@2/dist/tonconnect-ui.min.js"></script>
<style>
:root{
  --bg:#071a21; --bg2:#0c2630; --card:#10303b; --card2:#143a47; --line:rgba(120,220,210,.16);
  --text:#e9f7f5; --muted:#9bbdbb; --dim:#6f9795;
  --duck:#ffcd38; --duck2:#ff9d2e; --aqua:#37d6c4; --red:#ff8a7a; --green:#6fe3a0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(86px + env(safe-area-inset-bottom,0px));background:radial-gradient(120% 60% at 50% -10%,#12414d 0%,var(--bg) 60%) fixed}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.top svg{flex:none}
.brand{font-weight:800;font-size:19px;letter-spacing:.2px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.chip{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);line-height:1.25}
.chip b{display:block;color:var(--text);font-size:14px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;box-shadow:0 0 8px var(--green)}
.dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;letter-spacing:.2px}
.warn{background:rgba(255,205,56,.09);border-color:rgba(255,205,56,.35)}
.warn b{color:var(--duck)}
.muted{color:var(--muted);font-size:13px;line-height:1.45}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--muted)}
.big{font-size:26px;font-weight:800;color:var(--duck)}
.field{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line2,rgba(120,220,210,.3));border-radius:14px;padding:4px 6px 4px 14px}
.field input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:24px;font-weight:700;padding:8px 0}
.field span{font-weight:700;color:var(--muted);padding:0 8px}
.chips{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.chips button{flex:1;min-width:56px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 0;font-weight:700}
.chips button.on{background:var(--duck);color:#2b1d00;border-color:var(--duck)}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:800;background:linear-gradient(180deg,var(--duck),var(--duck2));color:#2b1d00;margin-top:10px}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.small{width:auto;padding:9px 14px;font-size:13px;border-radius:12px;margin-top:0}
.btn[disabled]{opacity:.45;cursor:default}
.addr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;word-break:break-all;color:var(--muted)}
.status{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--card2)}
.st-paid{background:rgba(255,205,56,.2);color:var(--duck)}
.st-delivered{background:rgba(111,227,160,.2);color:var(--green)}
.st-refund_requested{background:rgba(255,157,46,.2);color:var(--duck2)}
.st-refunded{background:rgba(55,214,196,.2);color:var(--aqua)}
.st-failed,.st-expired{background:rgba(255,138,122,.16);color:var(--red)}
ol,ul{margin:0;padding-left:20px}
li{margin:7px 0;font-size:14px;line-height:1.45}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(7,26,33,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.nav button{flex:1;background:transparent;border:0;padding:8px 0;border-radius:14px;color:var(--muted);font-size:12px;font-weight:700}
.nav button.on{background:var(--card2);color:var(--duck)}
.nav button span{display:block;font-size:20px;line-height:1.1}
.ov{position:fixed;inset:0;background:rgba(3,12,16,.78);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom,0px));text-align:center}
.sheet h2{margin:8px 0}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--card2);border-top-color:var(--duck);margin:6px auto 12px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.toast{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:99;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:14px;text-align:center}
.toast.err{border-color:rgba(255,138,122,.6)}
.toast.ok{border-color:rgba(111,227,160,.6)}
.langs{display:flex;gap:8px}
.langs button{flex:1;padding:9px 0;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700}
.langs button.on{background:var(--duck);color:#2b1d00;border-color:var(--duck)}
.full{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
a{color:var(--aqua)}
.nav button{font-size:11px}
.bar{height:10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--aqua),var(--duck));border-radius:99px;transition:width 1s linear}
.bal{font-size:34px;font-weight:800;color:var(--duck);line-height:1.1}
.bal small{font-size:16px;color:var(--muted);font-weight:700}
.stats3{display:flex;gap:8px;margin-top:10px}
.stats3>div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;color:var(--muted)}
.stats3 b{display:block;color:var(--text);font-size:13px;margin-top:2px;word-break:break-all}
.ranges{display:flex;gap:8px;margin:12px 0 8px}
.ranges button{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 0;font-weight:700;font-size:13px}
.ranges button.on{background:var(--duck);color:#2b1d00;border-color:var(--duck)}
.chead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.cprice{font-size:28px;font-weight:800;line-height:1.15}
.cchg{font-size:15px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--card2)}
.up{color:var(--green)}.down{color:var(--red)}
.cchg.up{background:rgba(111,227,160,.16)}.cchg.down{background:rgba(255,138,122,.16)}
.f-up{animation:fup 1s}.f-down{animation:fdown 1s}
@keyframes fup{0%{color:var(--green)}100%{color:var(--text)}}
@keyframes fdown{0%{color:var(--red)}100%{color:var(--text)}}
.cbox{position:relative;height:230px;margin-top:6px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cbox svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.clab{position:absolute;left:4px;font-size:10px;color:var(--dim);pointer-events:none}
.cdot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--c);animation:pulse 1.6s infinite;pointer-events:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--c)}100%{box-shadow:0 0 0 12px transparent}}
.cline{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35);display:none;pointer-events:none}
.ctip{position:absolute;top:2px;padding:5px 8px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:12px;pointer-events:none;white-space:nowrap;display:none;z-index:2}
.cempty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 20px}
.wd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.wd:last-child{border-bottom:0}
.st-pending{background:rgba(255,205,56,.2);color:var(--duck)}
.st-sent{background:rgba(111,227,160,.2);color:var(--green)}
.st-rejected,.st-cancelled{background:rgba(255,138,122,.16);color:var(--red)}
</style>
</head>

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const t = (key, vars) => {
  const raw = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  return raw.replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] !== undefined ? String(vars[k]) : "{" + k + "}"));
};
const nf = (n, max) => Number(n).toLocaleString(lang === "ru" ? "ru-RU" : lang === "bn" ? "bn-BD" : "en-US", { maximumFractionDigits: max === undefined ? 2 : max });
const buzz = (kind) => { try { tgw && tgw.HapticFeedback && (kind === "ok" ? tgw.HapticFeedback.notificationOccurred("success") : tgw.HapticFeedback.impactOccurred("light")); } catch (e) {} };

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "content-type": "application/json", "x-init-data": INIT },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error(data.error || "Error"); err.code = data.code; err.vars = data.vars; err.data = data; throw err; }
  const serverNow = data && (data.now || (data.state && data.state.now));
  if (serverNow) clockSkew = serverNow - Date.now();
  return data;
}
function errText(e) {
  if (e && e.code && I18N.en["err." + e.code]) return t("err." + e.code, e.vars || {});
  return e && e.message && e.code ? e.message : t("err.generic");
}
let toastTimer = null;
function toast(msg, kind) {
  $("#toast").innerHTML = '<div class="toast ' + (kind || "") + '">' + esc(msg) + "</div>";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("#toast").innerHTML = ""; }, 3500);
}
const closeOverlay = () => { $("#ov").innerHTML = ""; };
function openOverlay(html) { $("#ov").innerHTML = '<div class="ov"><div class="sheet">' + html + "</div></div>"; }
const nowMs = () => Date.now() + clockSkew;
const floor4 = (n) => Math.floor(n * 1e4 + 1e-6) / 1e4;
/** A price: 4 decimals from 1 USD up, more digits below (UTYA is a small number). */
function pf(p) {
  const n = Number(p);
  if (p == null || !isFinite(n) || n <= 0) return "-";
  if (n >= 1) return nf(n, 4);
  return nf(n, Math.min(12, Math.max(4, 3 - Math.floor(Math.log10(n)))));
}
const clock = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ":" : "") + String(m).padStart(h ? 2 : 1, "0") + ":" + String(x).padStart(2, "0"); };
const short = (a) => (a ? a.slice(0, 6) + "…" + a.slice(-6) : "-");
const dateText = (ms) => new Date(ms).toLocaleString(lang === "ru" ? "ru-RU" : lang === "bn" ? "bn-BD" : "en-GB", { dateStyle: "medium", timeStyle: "short" });

// ------------------------------------------------------------------ wallet (TonConnect)
function ton() {
  if (tonUI) return tonUI;
  try {
    if (!window.TON_CONNECT_UI) return null;
    tonUI = new window.TON_CONNECT_UI.TonConnectUI({
      manifestUrl: window.location.origin + "/tonconnect-manifest.json",
      actionsConfiguration: { twaReturnUrl: "https://t.me/" + BOT_USERNAME },
    });
    tonUI.onStatusChange((w) => {
      if (w && w.account && S) syncWallet(w.account.address).then(() => render()).catch(() => render());
      else if (S) render();
    });
    return tonUI;
  } catch (e) { return null; }
}
const connectedAccount = () => { const ui = ton(); return ui && ui.account ? ui.account : null; };
async function syncWallet(rawAddress) {
  const r = await api("/api/wallet", { address: rawAddress });
  S = r.state;
}

// ------------------------------------------------------------------ price chart (live)
const CHART_RANGES = [["1h", "1H"], ["24h", "24H"], ["7d", "7D"]];
const locale = () => (lang === "ru" ? "ru-RU" : lang === "bn" ? "bn-BD" : "en-GB");
const chartTime = (ms) => new Date(ms).toLocaleString(locale(), chartRange === "7d" ? { dateStyle: "medium", timeStyle: "short" } : chartRange === "1h" ? { timeStyle: "medium" } : { timeStyle: "short" });

function viewChart() {
  return '<div class="card"><h3>' + esc(t("chart.title")) + "</h3>" +
    '<div class="chead"><div class="cprice" id="cPrice">…</div><div class="cchg" id="cChg"></div></div>' +
    '<div class="ranges">' + CHART_RANGES.map((r) => '<button data-a="range" data-v="' + r[0] + '" class="' + (chartRange === r[0] ? "on" : "") + '">' + r[1] + "</button>").join("") + "</div>" +
    '<div class="cbox" id="cBox"></div><div class="stats3" id="cStats"></div>' +
    '<div class="muted" style="margin-top:10px" id="cNote">' + esc(t("chart.note")) + "</div></div>";
}

function drawChart() {
  const box = $("#cBox");
  if (!box) return;
  const d = chartData;
  const priceEl = $("#cPrice"), chgEl = $("#cChg"), stats = $("#cStats"), note = $("#cNote");
  chartGeo = null;
  if (!d) {
    box.innerHTML = '<div class="cempty muted">' + esc(chartErr ? t("chart.nodata") : t("buy.checking")) + "</div>";
    return;
  }
  priceEl.textContent = d.last ? "$" + pf(d.last) : "-";
  if (chartFlash) { priceEl.classList.remove("f-up", "f-down"); void priceEl.offsetWidth; priceEl.classList.add("f-" + chartFlash); chartFlash = ""; }
  const chg = d.changePct;
  chgEl.className = "cchg " + (chg == null ? "" : chg >= 0 ? "up" : "down");
  chgEl.textContent = chg == null ? "–" : (chg >= 0 ? "▲ " : "▼ ") + nf(Math.abs(chg), 2) + "%";
  const age = d.at ? Math.max(0, Math.round((nowMs() - d.at) / 1000)) : null;
  stats.innerHTML = "<div>" + esc(t("chart.high")) + "<b>$" + esc(pf(d.high)) + "</b></div><div>" + esc(t("chart.low")) + "<b>$" + esc(pf(d.low)) + "</b></div><div>" +
    esc(t("price.live")) + "<b>" + (age == null ? "-" : esc(t("price.age", { s: age }))) + "</b></div>";
  note.textContent = (d.live ? "" : t("chart.stale") + " ") + t("chart.note");
  const pts = d.points || [];
  if (pts.length < 2) { box.innerHTML = '<div class="cempty muted">' + esc(t("chart.nodata")) + "</div>"; return; }
  const t0 = pts[0][0], span = Math.max(1, pts[pts.length - 1][0] - t0);
  let lo = Infinity, hi = -Infinity;
  for (const p of pts) { if (p[1] < lo) lo = p[1]; if (p[1] > hi) hi = p[1]; }
  const X = (ms) => ((ms - t0) / span) * 97;
  const Y = (v) => (hi > lo ? 8 + (1 - (v - lo) / (hi - lo)) * 84 : 50);
  const xs = pts.map((p) => X(p[0])), ys = pts.map((p) => Y(p[1]));
  const line = pts.map((p, i) => (i ? "L" : "M") + xs[i].toFixed(2) + " " + ys[i].toFixed(2)).join(" ");
  const area = line + " L" + xs[xs.length - 1].toFixed(2) + " 100 L" + xs[0].toFixed(2) + " 100 Z";
  const col = pts[pts.length - 1][1] >= pts[0][1] ? "var(--green)" : "var(--red)";
  chartGeo = { pts, xs, ys };
  box.innerHTML = '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="color:' + col + '"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".32"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>' +
    [8, 50, 92].map((y) => '<line x1="0" x2="100" y1="' + y + '" y2="' + y + '" stroke="rgba(255,255,255,.08)" vector-effect="non-scaling-stroke"/>').join("") +
    '<path d="' + area + '" fill="url(#cg)"/><path d="' + line + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>' +
    '<span class="clab" style="top:0">$' + esc(pf(hi)) + '</span><span class="clab" style="bottom:0">$' + esc(pf(lo)) + "</span>" +
    '<div class="cdot" style="left:' + xs[xs.length - 1] + "%;top:" + ys[ys.length - 1] + "%;--c:" + col + '"></div><div class="cline" id="cLine"></div><div class="ctip" id="cTip"></div>';
}

function bindChart() {
  const box = $("#cBox");
  if (!box) return;
  const move = (ev) => {
    if (!chartGeo) return;
    chartHold = true;
    const r = box.getBoundingClientRect();
    const fx = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)) * 100;
    let best = 0, bd = Infinity;
    chartGeo.xs.forEach((x, i) => { const dd = Math.abs(x - fx); if (dd < bd) { bd = dd; best = i; } });
    const line = $("#cLine"), tip = $("#cTip");
    if (!line || !tip) return;
    const x = chartGeo.xs[best], p = chartGeo.pts[best];
    line.style.display = "block"; line.style.left = x + "%";
    tip.style.display = "block";
    tip.innerHTML = "$" + esc(pf(p[1])) + '<br><span style="color:var(--muted)">' + esc(chartTime(p[0])) + "</span>";
    if (x > 55) { tip.style.left = "auto"; tip.style.right = 100 - x + "%"; } else { tip.style.right = "auto"; tip.style.left = x + "%"; }
  };
  const leave = () => { chartHold = false; drawChart(); };
  box.addEventListener("pointermove", move);
  box.addEventListener("pointerdown", move);
  box.addEventListener("pointerleave", leave);
  box.addEventListener("pointercancel", leave);
  box.addEventListener("pointerup", (ev) => { if (ev.pointerType === "touch") leave(); });
}

async function loadChart() {
  if (!S || tab !== "chart") return;
  const range = chartRange;
  try {
    const d = await api("/api/chart?range=" + encodeURIComponent(range));
    if (range !== chartRange || tab !== "chart") return;
    const prev = chartData && chartData.range === range ? chartData.last : null;
    chartFlash = prev && d.last && d.last !== prev ? (d.last > prev ? "up" : "down") : "";
    chartData = d; chartErr = false;
    if (d.last) S.price = Object.assign({}, S.price || { tonUsd: 0, perTon: 0 }, { utyaUsd: d.last, at: d.at || (S.price && S.price.at) || nowMs() });
  } catch (e) {
    if (e && (e.code === "banned" || e.code === "join_required")) return fail(e);
    chartErr = true;
  }
  if (tab === "chart" && !chartHold) drawChart();
}

async function fail(e) {
  if (e && e.code === "banned") return showBanned(e.data);
  if (e && e.code === "join_required") return showGate(e.data.channels);
  toast(errText(e), "err");
}

function viewInfo() {
  const st = S.settings;
  const langs = [["en", "English"], ["bn", "বাংলা"], ["ru", "Русский"]];
  return '<div class="card"><h3>' + esc(t("info.title")) + "</h3><ul>" +
    "<li>" + esc(t("info.1")) + "</li><li>" + esc(t("info.2", { hours: st.deliveryHours })) + "</li><li>" + esc(t("info.3")) + "</li><li>" + esc(t("info.4", { pct: nf(st.feePct, 2) })) + "</li><li>" + esc(t("info.5")) + "</li><li>" + esc(t("info.6")) + "</li><li>" + esc(t(S.official ? "info.7o" : "info.7")) + "</li><li>" + esc(t("info.8", { h: S.mining.sessionHours })) + "</li><li>" + esc(t("info.9", { hours: st.deliveryHours })) + "</li></ul></div>" +
    '<div class="card"><div class="muted">' + esc(t("info.payTo")) + '</div><div class="addr" style="margin-bottom:10px">' + esc(st.payAddress || "-") + '</div><div class="muted">' + esc(t("info.contract")) + '</div><div class="addr">' + esc(S.token.jetton) + "</div></div>" +
    (st.support ? '<div class="card"><button class="btn ghost" data-a="support">' + esc(t("info.support")) + "</button></div>" : "") +
    '<div class="card"><h3>' + esc(t("info.lang")) + '</h3><div class="langs">' + langs.map((l) => '<button data-a="lang" data-v="' + l[0] + '" class="' + (lang === l[0] ? "on" : "") + '">' + l[1] + "</button>").join("") + "</div></div>";
}

function render() {
  if (!S) return;
  document.documentElement.lang = lang;
  const body = tab === "mine" ? viewMine() : tab === "buy" ? viewBuy() : tab === "chart" ? viewChart() : tab === "orders" ? viewOrders() : viewInfo();
  const nav = [["mine", "⛏️"], ["buy", "🦆"], ["chart", "📈"], ["orders", "📦"], ["info", "ℹ️"]];
  $("#app").innerHTML = '<div class="top">' + DUCK + '<div class="brand">UTYA Miner<small>' + esc(t("brand.sub")) + "</small></div>" + priceChip() + "</div>" + body +
    '<div class="nav">' + nav.map((n) => '<button data-a="tab" data-v="' + n[0] + '" class="' + (tab === n[0] ? "on" : "") + '"><span>' + n[1] + "</span>" + esc(t("nav." + n[0])) + "</button>").join("") + "</div>";
  const input = $("#amt");
  if (input) input.addEventListener("input", onAmount);
  const wd = $("#wdAmt");
  if (wd) wd.addEventListener("input", (e) => { wdAmount = e.target.value.replace(",", "."); });
  if (tab === "chart") { bindChart(); drawChart(); loadChart(); }
}

function refreshQuoteUI() {
  const qb = $("#quoteBox"), pw = $("#payWrap");
  if (qb) qb.innerHTML = quoteBox();
  if (pw) pw.innerHTML = payBtn();
}

// ------------------------------------------------------------------ quote
let amtTimer = null;
function onAmount(e) {
  amount = e.target.value.replace(",", ".");
  quote = null; quoteErr = null;
  document.querySelectorAll(".chips button").forEach((b) => b.classList.toggle("on", b.dataset.v === String(amount)));
  refreshQuoteUI();
  clearTimeout(amtTimer);
  amtTimer = setTimeout(refreshQuote, 350);
}
async function refreshQuote() {
  if (!S || tab !== "buy" || quoting) return;
  const wanted = amount;
  quoting = true;
  try {
    const r = await api("/api/quote", { ton: Number(wanted) });
    if (wanted === amount) { quote = r.quote; quoteErr = null; }
  } catch (e) {
    if (e && e.code === "banned") return showBanned(e.data);
    if (wanted === amount) { quote = null; quoteErr = errText(e); }
  } finally { quoting = false; }
  if (wanted !== amount) return refreshQuote();
  refreshQuoteUI();
}
async function refreshState() {
  try {
    const r = await api("/api/state");
    S = r;
    lang = S.user.lang || lang;
    const typing = document.activeElement && document.activeElement.id === "wdAmt";
    if (tab === "orders" || tab === "info" || (tab === "mine" && !typing)) render(); else { const c = $("#chip"); if (c) c.outerHTML = priceChip(); }
  } catch (e) { /* keep the old state */ }
}

// ------------------------------------------------------------------ payment
function showPay(stage, extra) {
  if (stage === "confirm") openOverlay('<div class="spin"></div><h2>' + esc(t("pay.confirm")) + "</h2>");
  else if (stage === "wait") openOverlay('<div class="spin"></div><h2>' + esc(t("pay.wait")) + "</h2>");
  else if (stage === "slow") openOverlay("<h2>⏳</h2><p class=\"muted\">" + esc(t("pay.slow")) + '</p><button class="btn" data-a="closeov">' + esc(t("pay.close")) + "</button>");
  else if (stage === "done") openOverlay('<div style="font-size:54px">🦆</div><h2>' + esc(t("pay.done")) + '</h2><p class="muted">' + esc(t("pay.doneBody", { utya: nf(extra.utya, 2), hours: S.settings.deliveryHours })) + '</p><button class="btn" data-a="toOrders">' + esc(t("pay.toOrders")) + "</button>");
}

async function startPay() {
  if (busy) return;
  const ui = ton();
  if (!ui) return toast(t("err.generic"), "err");
  const acc = ui.account;
  if (!acc) return ui.openModal();
  busy = true;
  let prepared;
  try {
    await syncWallet(acc.address);
    prepared = (await api("/api/pay/prepare", { ton: Number(amount) })).payment;
  } catch (e) {
    busy = false;
    if (e && e.code === "join_required") return showGate(e.data.channels);
    if (e && e.code === "banned") return showBanned(e.data);
    return toast(errText(e), "err");
  }
  showPay("confirm");
  try {
    await ui.sendTransaction({ validUntil: prepared.validUntil, from: acc.address, messages: prepared.messages });
  } catch (e) { busy = false; closeOverlay(); return toast(t("pay.cancelled"), "err"); }
  showPay("wait");
  const started = Date.now();
  while (Date.now() - started < 180000) {
    let r = null;
    try { r = await api("/api/pay/check", { id: prepared.id }); } catch (e) { /* keep trying */ }
    if (r && r.order && ["paid", "delivered", "refund_requested", "refunded"].includes(r.order.status)) {
      busy = false; S = r.state; buzz("ok"); showPay("done", r.order); render(); return;
    }
    await new Promise((res) => setTimeout(res, 3000));
  }
  busy = false; showPay("slow");
}

// ------------------------------------------------------------------ special screens
function showBanned(data) {
  const support = data && data.support;
  $("#app").innerHTML = '<div class="full"><div style="font-size:54px">🚫</div><h2>' + esc(t("banned.title")) + "</h2>" + (support ? '<button class="btn" data-a="support" data-url="' + esc(support) + '">' + esc(t("banned.contact")) + "</button>" : "") + "</div>";
}
function showGate(channels) {
  $("#app").innerHTML = '<div class="full"><div style="font-size:54px">📣</div><h2>' + esc(t("gate.title")) + '</h2><p class="muted">' + esc(t("gate.body")) + "</p>" +
    (channels || []).map((c) => '<button class="btn ghost" data-a="link" data-url="' + esc(c.url) + '">' + esc(c.name) + "</button>").join("") + '<button class="btn" data-a="reload">' + esc(t("gate.btn")) + "</button></div>";
}
function openLink(url) { try { if (tgw && /^https:\/\/t\.me\//.test(url) && tgw.openTelegramLink) return tgw.openTelegramLink(url); if (tgw && tgw.openLink) return tgw.openLink(url); } catch (e) {} window.open(url, "_blank"); }

// ------------------------------------------------------------------ clicks
document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a;
  buzz();
  if (a === "tab") { tab = el.dataset.v; render(); if (tab === "buy") { quote = null; refreshQuote(); } return; }
  if (a === "preset") { amount = el.dataset.v; const i = $("#amt"); if (i) i.value = amount; document.querySelectorAll(".chips button").forEach((b) => b.classList.toggle("on", b.dataset.v === amount)); quote = null; quoteErr = null; refreshQuoteUI(); refreshQuote(); return; }
  if (a === "connect") { const ui = ton(); if (ui) ui.openModal(); else toast(t("err.generic"), "err"); return; }
  if (a === "disconnect") { const ui = ton(); if (ui) { try { await ui.disconnect(); } catch (e) {} } render(); return; }
  if (a === "pay") return startPay();
  if (a === "range") { chartRange = el.dataset.v; chartData = null; chartErr = false; render(); return; }
  if (a === "mineStart") {
    try { const r = await api("/api/mine/start", {}); S = r.state; toast(t("mine.started"), "ok"); buzz("ok"); render(); } catch (e) { await fail(e); await refreshState(); }
    return;
  }
  if (a === "mineClaim") {
    try { const r = await api("/api/mine/claim", {}); S = r.state; toast(t("mine.claimed", { n: nf(r.claimed, 4) }), "ok"); buzz("ok"); render(); } catch (e) { await fail(e); await refreshState(); }
    return;
  }
  if (a === "wdAll") { wdAmount = String(floor4(S.mining.balance)); const i = $("#wdAmt"); if (i) i.value = wdAmount; return; }
  if (a === "wdSubmit") {
    const acc = connectedAccount();
    if (!acc) { const ui = ton(); if (ui) ui.openModal(); return; }
    if (busy) return;
    busy = true;
    try {
      await syncWallet(acc.address);
      const r = await api("/api/withdraw", { amount: Number(String(wdAmount).replace(",", ".")) });
      S = r.state; wdAmount = ""; toast(t("wd.done"), "ok"); buzz("ok"); render();
    } catch (e) { await fail(e); await refreshState(); } finally { busy = false; }
    return;
  }
  if (a === "wdCancel") {
    const w = S.withdrawals.find((x) => x.id === el.dataset.id);
    if (!w) return;
    openOverlay("<h2>↩️</h2><p>" + esc(t("wd.cancelAsk", { n: nf(w.amount, 4) })) + '</p><button class="btn" data-a="wdCancelYes" data-id="' + esc(w.id) + '">' + esc(t("wd.cancelYes")) + '</button><button class="btn ghost" data-a="closeov">' + esc(t("wd.cancelNo")) + "</button>");
    return;
  }
  if (a === "wdCancelYes") {
    closeOverlay();
    try { const r = await api("/api/withdraw/cancel", { id: el.dataset.id }); S = r.state; toast(t("wd.cancelled"), "ok"); render(); } catch (e) { await fail(e); await refreshState(); }
    return;
  }
  if (a === "closeov") return closeOverlay();
  if (a === "toOrders") { closeOverlay(); tab = "orders"; render(); return; }
  if (a === "support") return openLink(el.dataset.url || (S && S.settings.support));
  if (a === "link") return openLink(el.dataset.url);
  if (a === "reload") return location.reload();
  if (a === "lang") {
    try { const r = await api("/api/lang", { lang: el.dataset.v }); S = r.state; lang = S.user.lang; render(); } catch (e) { toast(errText(e), "err"); }
    return;
  }
  if (a === "refund") {
    const o = S.orders.find((x) => x.id === el.dataset.id);
    if (!o) return;
    openOverlay("<h2>↩️</h2><p>" + esc(t("orders.refundAsk", { ton: nf(o.ton, 4) })) + '</p><button class="btn" data-a="refundYes" data-id="' + esc(o.id) + '">' + esc(t("orders.refundYes")) + '</button><button class="btn ghost" data-a="closeov">' + esc(t("orders.refundNo")) + "</button>");
    return;
  }
  if (a === "refundYes") {
    closeOverlay();
    try { const r = await api("/api/refund", { id: el.dataset.id }); S = r.state; toast(t("orders.refundDone"), "ok"); render(); } catch (e) { toast(errText(e), "err"); await refreshState(); }
    return;
  }
});

// ------------------------------------------------------------------ start
async function boot() {
  try {
    S = await api("/api/state");
  } catch (e) {
    if (e && e.code === "join_required") return showGate(e.data.channels);
    if (e && e.code === "banned") return showBanned(e.data);
    $("#app").innerHTML = '<div class="full"><div style="font-size:54px">🦆</div><p class="muted">' + esc(errText(e)) + "</p></div>";
    return;
  }
  lang = S.user.lang || "en";
  ton(); // create the wallet connector early so a restored wallet shows up
  render();
  const acc = connectedAccount();
  if (acc) syncWallet(acc.address).then(render).catch(() => {});
  refreshQuote();
  setInterval(() => { if (!document.hidden) { refreshState(); if (tab === "buy" && !busy) refreshQuote(); } }, 15000);
  setInterval(() => { const c = $("#chip"); if (c && S) c.outerHTML = priceChip(); }, 1000);
  setInterval(tickMining, 1000); // the mining counter runs live
  setInterval(() => { if (!document.hidden && tab === "chart") loadChart(); }, 5000); // the chart follows the live price
}
boot();
</script>
